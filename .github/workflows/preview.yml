name: Preview Deploy (PR)

# Per-PR preview for LDCo client sites. Builds the PR and deploys it to a
# DETERMINISTIC Netlify alias, then posts the real URL into the same Zulip
# #qa topic the QA bot opened. The QA bot no longer guesses a preview URL —
# this workflow is the single source of truth, so there is no repo->site map
# to drift out of date (that gap is what broke GRL PR #1).
#
# Secrets (org-level, inherited by every repo; NETLIFY_SITE_ID is per-repo):
#   NETLIFY_AUTH_TOKEN  — org secret (already set)
#   NETLIFY_SITE_ID     — per-repo secret (set by the provisioning script)
#   ZULIP_QA_BOT_AUTH   — org secret: the full "Basic <base64>" header value
#                         for qa-bot@backstage.lockard.co

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build & deploy preview to Netlify alias
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          ALIAS="deploy-preview-${PR_NUMBER}"
          OUT=$(npx netlify deploy --build --alias "$ALIAS" --json)
          URL=$(printf '%s' "$OUT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).deploy_url)}catch{console.log("")}})')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $URL"

      - name: Post preview URL into the Zulip #qa topic
        if: steps.deploy.outputs.url != ''
        env:
          # Passed via env (never inlined into the script) — PR title is
          # attacker-controllable, so this avoids shell injection.
          ZULIP_AUTH: ${{ secrets.ZULIP_QA_BOT_AUTH }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ -z "$ZULIP_AUTH" ]; then
            echo "ZULIP_QA_BOT_AUTH not set — skipping Zulip post"; exit 0
          fi
          TOPIC="${REPO_NAME}: PR #${PR_NUMBER} ${PR_TITLE}"
          CONTENT=":check: **Preview is live for QA:** ${PREVIEW_URL}
          (updates on every push to this branch — same link, new build)"
          curl -s -X POST "https://backstage.lockard.co/api/v1/messages" \
            -H "Authorization: ${ZULIP_AUTH}" \
            --data-urlencode "type=stream" \
            --data-urlencode "to=qa" \
            --data-urlencode "topic=${TOPIC}" \
            --data-urlencode "content=${CONTENT}"
